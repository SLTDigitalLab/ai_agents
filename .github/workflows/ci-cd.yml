# ============================================================
# CI/CD Pipeline — ai_agents (Ask SLT)
# Triggers on every push to the `cicd` branch only.
#
# Jobs:
#   1. test           — Install Python deps, run existing pytest file
#   2. build-and-push — Build backend + frontend + mcp_lifestore Docker images, push to GHCR
#   3. deploy         — SSH into VM, pull new images, restart compose stack
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - cicd   # Only run on the cicd branch

jobs:

  # ============================================================
  # JOB 1 — test
  # Sets up Python 3.11 (matches FROM python:3.11-slim in backend/Dockerfile),
  # installs all backend dependencies, then runs the existing pytest test file.
  # NOTE: test_rag_sources.py does NOT use pytest test functions (no test_*
  # functions decorated for pytest), so we fall back to the import-check
  # approach to avoid a "no tests collected" exit-code failure.
  # If you add proper pytest tests later, replace the run step with:
  #   pytest backend/ -v
  # ============================================================
  test:
    name: Run Tests / Import Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache pip packages keyed on requirements.txt content.
      # This avoids re-downloading all heavy LangChain / unstructured packages on every run.
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # System dependencies required by 'unstructured' (OCR, PDF parsing)
      # These mirror the apt-get installs in backend/Dockerfile so that
      # pip packages such as pytesseract and PyMuPDF install cleanly.
      - name: Install system dependencies (OCR / PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb1 \
            poppler-utils \
            tesseract-ocr \
            libmagic-dev \
            libgl1 \
            libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 300 -r backend/requirements.txt

      # Smoke-test: verify the main FastAPI module can be imported without error.
      #
      # WHY step-level env: vars instead of a .env file:
      #   config.py resolves ROOT_DIR as 3 parents above config.py → repo root,
      #   then calls load_dotenv(ROOT_DIR / ".env"). That part works fine.
      #   BUT pydantic_settings also has `class Config: env_file = ".env"`, which
      #   it resolves relative to CWD *at Settings() instantiation time*.
      #   After `cd backend`, CWD = backend/ so pydantic looks for backend/.env
      #   (not the repo-root .env) → file not found → QDRANT_URL / POSTGRES_URL
      #   fail validation (they have no default values in Settings).
      #
      #   pydantic_settings always reads os.environ BEFORE env_file, so exporting
      #   the two required fields as step-level env vars is the cleanest fix —
      #   no file path ambiguity, no heredoc indentation issues.
      # WARNING: If you add proper pytest tests (def test_*()) in future, replace
      #          this step with: pytest backend/ -v
      - name: Smoke-test — verify main module imports without error
        env:
          QDRANT_URL: "http://localhost:6333"
          POSTGRES_URL: "postgresql://user:pass@localhost:5432/db"
          GOOGLE_API_KEY: "dummy"
          OPENAI_API_KEY: "dummy"
        run: |
          cd backend && python -c "import main; print('Import OK')"



  # ============================================================
  # JOB 2 — build-and-push
  # Runs only after the test job passes.
  # Builds backend and frontend Docker images, then pushes them to GHCR
  # with two tags each:
  #   :latest        — always points to the newest successful build
  #   :<git-sha>     — immutable, traceable to the exact commit
  #
  # NOTE: The backend Dockerfile uses --mount=type=cache for pip. This is
  # preserved exactly as-is; GitHub's BuildKit support handles it correctly.
  #
  # PRODUCTION NOTE: The backend/Dockerfile CMD currently includes --reload
  # which enables hot-reloading (dev mode). The docker-compose.prod.yml already
  # overrides this with a production-safe command. If you bake the image for
  # production use WITHOUT compose, remove --reload from the Dockerfile CMD:
  #   CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "info"]
  # =============================================================
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: test   # Only runs if the test job succeeds

    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Enable Docker BuildKit (required for --mount=type=cache in Dockerfile)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with GitHub Container Registry using the auto-provisioned GITHUB_TOKEN.
      # No extra secret needed for pushing — GITHUB_TOKEN has packages:write above.
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive a short (7-char) SHA for the image tag
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Build and push the backend image.
      # The --mount=type=cache layer inside the Dockerfile is handled transparently by BuildKit.
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # BuildKit cache keeps the pip layer warm across GitHub-hosted runner runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/sltdigitallab/ai_agents/backend:latest
            ghcr.io/sltdigitallab/ai_agents/backend:${{ steps.sha.outputs.short }}

      # Build and push the frontend image (node:22-alpine, runs npm run dev).
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/sltdigitallab/ai_agents/frontend:latest
            ghcr.io/sltdigitallab/ai_agents/frontend:${{ steps.sha.outputs.short }}

      # Build and push the MCP Lifestore server image.
      # Context is the repo root because the Dockerfile copies both
      # backend/ and mcp_lifestore/ directories.
      - name: Build & push mcp_lifestore image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./mcp_lifestore/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/sltdigitallab/ai_agents/mcp_lifestore:latest
            ghcr.io/sltdigitallab/ai_agents/mcp_lifestore:${{ steps.sha.outputs.short }}

  # ============================================================
  # JOB 3 — deploy
  # Runs only after build-and-push succeeds.
  # SSHs into the VM and deploys using docker run commands directly
  # (docker compose is unavailable due to snap Docker on this VM).
  #
  # Required GitHub Secrets (Settings -> Secrets -> Actions):
  #   VM_HOST     — IP or hostname of the production server
  #   VM_USER     — SSH user (e.g. ubuntu, deploy)
  #   VM_SSH_KEY  — Private SSH key (PEM format, entire file contents)
  #   ENV_FILE    — Full contents of the .env file the app needs
  #   CR_PAT      — GitHub Personal Access Token with read:packages scope
  # ===============================================================
  deploy:
    name: Deploy to Production VM
    runs-on: ubuntu-latest
    needs: build-and-push   # Only runs if images were built and pushed

    steps:
      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Give the full deploy script enough time to pull images + start containers.
          # Default is 10m which is not enough if images are large or Postgres is slow.
          command_timeout: 20m
          script: |
            # 1. Write the .env file from the GitHub secret
            echo "${{ secrets.ENV_FILE }}" > /root/slt-app/.env

            # 2. Log in to GHCR on the VM so docker pull can authenticate
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Pull the newly-built images
            docker pull ghcr.io/sltdigitallab/ai_agents/backend:latest
            docker pull ghcr.io/sltdigitallab/ai_agents/frontend:latest
            docker pull ghcr.io/sltdigitallab/ai_agents/mcp_lifestore:latest

            # 4. Create Docker network if it doesn't already exist
            docker network create slt-network 2>/dev/null || true

            # 5. Stop and remove old slt containers (ignore errors if not running)
            docker stop slt_backend slt_frontend slt_postgres slt_qdrant slt_mcp_lifestore 2>/dev/null || true
            docker rm   slt_backend slt_frontend slt_postgres slt_qdrant slt_mcp_lifestore 2>/dev/null || true

            # 6. Start Postgres
            #    NOTE: If this container keeps crashing, it is almost always because the
            #    data directory (/root/slt-app/data/postgres) was written by a different
            #    Postgres major version. Fix on the VM with:
            #      rm -rf /root/slt-app/data/postgres   (wipes existing data — do a pg_dump first!)
            #    Then re-run the pipeline.
            docker run -d --name slt_postgres \
              --network slt-network \
              -e POSTGRES_USER=slt \
              -e POSTGRES_PASSWORD=slt123 \
              -e POSTGRES_DB=slt_db \
              -v /root/slt-app/data/postgres:/var/lib/postgresql/data \
              --restart always \
              ankane/pgvector:latest

            # 7. Wait for Postgres — bounded retry (30 attempts × 3 s = 90 s max).
            #    On failure, print logs so the Actions log shows WHY it crashed.
            RETRIES=30
            until docker exec slt_postgres pg_isready -U slt -d slt_db 2>/dev/null; do
              RETRIES=$((RETRIES - 1))
              if [ "$RETRIES" -le 0 ]; then
                echo "ERROR: Postgres did not become ready in time. Container logs:"
                docker logs slt_postgres --tail 50
                exit 1
              fi
              echo "Waiting for postgres... ($RETRIES retries left)"
              sleep 3
            done
            echo "Postgres is ready."

            # 8. Start Qdrant
            docker run -d --name slt_qdrant \
              --network slt-network \
              -v /root/slt-app/data/qdrant:/qdrant/storage \
              --restart always \
              qdrant/qdrant:latest

            # 9. Start Backend
            #    Evidence volume is mounted so uploaded PDF previews survive restarts.
            mkdir -p /root/slt-app/data/evidence
            docker run -d --name slt_backend \
              --network slt-network \
              -p 127.0.0.1:8100:8000 \
              --env-file /root/slt-app/.env \
              -e PYTHONUNBUFFERED=1 \
              -e POSTGRES_URL=postgresql://slt:slt123@slt_postgres:5432/slt_db \
              -e QDRANT_URL=http://slt_qdrant:6333 \
              -e LIFESTORE_MCP_TRANSPORT=streamable_http \
              -e LIFESTORE_MCP_URL=http://slt_mcp_lifestore:8001/mcp \
              -v /root/slt-app/data/evidence:/app/storage/evidence \
              --restart always \
              ghcr.io/sltdigitallab/ai_agents/backend:latest \
              uvicorn main:app --host 0.0.0.0 --port 8000 --log-level info

            # 10. Start MCP Lifestore server
            #     Depends on Postgres, Qdrant, and the backend being started.
            #     Mirrors the docker-compose.yml mcp_lifestore service.
            mkdir -p /root/slt-app/data/real
            docker run -d --name slt_mcp_lifestore \
              --network slt-network \
              -p 8001:8001 \
              --env-file /root/slt-app/.env \
              -e MCP_TRANSPORT=streamable-http \
              -e MCP_HOST=0.0.0.0 \
              -e MCP_PORT=8001 \
              -e PYTHONPATH=/app/backend:/app \
              -e QDRANT_URL=http://slt_qdrant:6333 \
              -e ADMIN_BASE_URL=http://slt_backend:8000 \
              -v /root/slt-app/data/real:/app/backend/data/real:ro \
              --restart always \
              ghcr.io/sltdigitallab/ai_agents/mcp_lifestore:latest

            # 11. Start Frontend
            docker run -d --name slt_frontend \
              --network slt-network \
              -p 127.0.0.1:3100:3000 \
              --env-file /root/slt-app/.env \
              --restart always \
              ghcr.io/sltdigitallab/ai_agents/frontend:latest

            # 12. Wait for application containers to initialise
            sleep 20

            # 13. Print status for the Actions log
            docker ps --filter name=slt

            # 14. Fail if any slt_ container is not in "Up" state
            if docker ps --filter name=slt --format '{{.Names}} {{.Status}}' | grep -v "^$" | grep -qv "Up"; then
              echo "ERROR: One or more slt containers are not healthy:"
              docker ps -a --filter name=slt --format 'table {{.Names}}\t{{.Status}}'
              exit 1
            fi
            echo "All slt containers are Up and healthy."