[pytest]
# Only collect the regression suite (keeps the legacy test_rag_sources.py script out).
testpaths = tests

# pytest-asyncio: let plain `async def test_*` functions run without per-test decorators.
asyncio_mode = auto

markers =
    routing: end-to-end supervisor routing tests that call the embedding API (network + API key required; auto-skipped when unavailable)
