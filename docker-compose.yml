version: '3.8'

services:
  db_postgres:
    image: ankane/pgvector:latest
    container_name: slt_postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U slt -d slt_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: slt
      POSTGRES_PASSWORD: slt123
      POSTGRES_DB: slt_db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always

  db_qdrant:
    image: qdrant/qdrant:latest
    container_name: slt_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: always

  backend:
    build:
      context: ./backend
    container_name: slt_backend
    ports:
      - "8000:8000"
    depends_on:
      db_postgres:
        condition: service_healthy
      db_qdrant:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: 1
      POSTGRES_URL: postgresql://slt:slt123@db_postgres:5432/slt_db
      QDRANT_URL: http://slt_qdrant:6333
      # Ask LifeStore MCP — the backend talks to the mcp_lifestore container over
      # the Docker network. Must override .env's LIFESTORE_MCP_URL, which points at
      # 127.0.0.1 (that would resolve to the backend container itself).
      LIFESTORE_MCP_TRANSPORT: streamable_http
      LIFESTORE_MCP_URL: http://mcp_lifestore:8001/mcp
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./backend/routers/service-account.json:/service-account.json:ro
    restart: always

  mcp_lifestore:
    build:
      context: .
      dockerfile: mcp_lifestore/Dockerfile
    container_name: slt_mcp_lifestore
    working_dir: /app
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      PYTHONPATH: /app/backend:/app
      QDRANT_URL: http://slt_qdrant:6333
      ADMIN_BASE_URL: http://backend:8000
    depends_on:
      db_postgres:
        condition: service_healthy
      db_qdrant:
        condition: service_started
      backend:
        condition: service_started
    volumes:
      - ./backend/data/real:/app/backend/data/real:ro
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: slt_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: always
