version: '3.8'

services:

  db_postgres:
    image: ankane/pgvector:latest
    container_name: slt_postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U slt -d slt_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: slt
      POSTGRES_PASSWORD: slt123
      POSTGRES_DB: slt_db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always

  mcp_lifestore:
    build:
      context: .
      dockerfile: mcp_lifestore/Dockerfile
    container_name: slt_mcp_lifestore
    working_dir: /app
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      PYTHONPATH: /app/backend:/app
      QDRANT_URL: http://slt_qdrant:6333
      ADMIN_BASE_URL: http://backend:8000
    depends_on:
      db_postgres:
        condition: service_healthy
      db_qdrant:
        condition: service_started
      backend:
        condition: service_started
    volumes:
      - ./backend/data/real:/app/backend/data/real:ro
    restart: always  

  db_qdrant:
    image: qdrant/qdrant:latest
    container_name: slt_qdrant
    ports:
      - "6335:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: always

  backend:
    build:
      context: ./backend
    container_name: slt_backend
    ports:
      - "8000:8000"
      - "8100:8000"
    
    depends_on:
      db_postgres:
        condition: service_healthy
      db_qdrant:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      POSTGRES_URL: postgresql://slt:slt123@db_postgres:5432/slt_db
      QDRANT_URL: http://slt_qdrant:6333
      # Ask LifeStore MCP — loaded in-process by the /api/v1/lifestore/mcp-chat router.
      # The router's default path resolution is wrong inside the container, so pin it here.
      LIFESTORE_MCP_SERVER_PATH: /app/mcp_lifestore/server.py
      LIFESTORE_PRODUCTS_JSON: /app/data/real/lifestore_all.json
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
      - ./mcp_lifestore:/app/mcp_lifestore:ro
      - ./data/evidence:/app/storage/evidence
    restart: always

    

  frontend:
    build:
      context: ./frontend
    container_name: slt_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: always
